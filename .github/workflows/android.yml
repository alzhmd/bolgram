name: Android app

on:
  push:
    branches: [main]
    paths: ['zinipay_forwarder/**', '.github/workflows/android.yml']
    tags: ['v*']
  pull_request:
    paths: ['zinipay_forwarder/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zinipay_forwarder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Prepare release keystore (falls back to debug signing when secrets are absent)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "mode=release key" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug key (secrets not configured)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          BOLGRAM_SERVER: ${{ vars.BOLGRAM_SERVER }}
        run: |
          DEFINE=""
          if [ -n "$BOLGRAM_SERVER" ]; then DEFINE="--dart-define=BOLGRAM_SERVER=$BOLGRAM_SERVER"; fi
          flutter build apk --release $DEFINE

      - name: Name the APK and print its SHA-256
        id: apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "bolgram-${VERSION}.apk"
          SHA=$(sha256sum "bolgram-${VERSION}.apk" | cut -d' ' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "APK: bolgram-${VERSION}.apk (signed with ${{ steps.signing.outputs.mode }})"
          echo "SHA-256: $SHA"
          {
            echo "### Bolgram Android $VERSION"
            echo "- Signing: ${{ steps.signing.outputs.mode }}"
            echo "- SHA-256: \`$SHA\`"
            echo ""
            echo "Set on the server: ANDROID_APP_VERSION=$VERSION ANDROID_APK_SHA256=$SHA ANDROID_APK_URL=<download url>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$SHA  bolgram-${VERSION}.apk" > "bolgram-${VERSION}.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bolgram-apk
          path: |
            zinipay_forwarder/bolgram-*.apk
            zinipay_forwarder/bolgram-*.apk.sha256
          if-no-files-found: error

      - name: Attach to GitHub release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zinipay_forwarder/bolgram-*.apk
            zinipay_forwarder/bolgram-*.apk.sha256
          body: |
            SHA-256: `${{ steps.apk.outputs.sha }}`
