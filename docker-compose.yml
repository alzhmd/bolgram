# docker compose up -d --build   (fill .env first; DOMAIN and SITE_DOMAIN must point to this server)
# One-command setup on a fresh server: sudo bash deploy/install.sh
services:
  bolgram:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/bolgram.db
      UPLOAD_DIR: /data/uploads
      # Caddy reaches the app over the Docker network
      TRUST_PROXY: 172.16.0.0/12
    volumes:
      - bolgram-data:/data
    expose:
      - "4000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [bolgram]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./website/public:/srv/site:ro
      - caddy-data:/data

volumes:
  bolgram-data:
  caddy-data:
